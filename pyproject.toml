[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dtdl-to-ontology"
version = "0.1.0"
description = "Direct DTDLv3 to Fabric Ontology new-experience converter"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/falloutxAY/dtdl-to-ontology"
Issues = "https://github.com/falloutxAY/dtdl-to-ontology/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "setuptools>=77"]

[project.scripts]
dtdl-to-ontology = "dtdl_to_ontology.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["willow: integration tests requiring the explicitly acquired Willow fixture"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
