name: Conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-and-target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python tools/fetch_willow.py .fixtures/willow
      - run: python -m pytest
  independent-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: python -m pip install -e .
      - run: dotnet build tools/DtdlOracle/DtdlOracle.csproj --verbosity quiet
      - run: dotnet run --project tools/DtdlOracle/DtdlOracle.csproj --no-build -- tests/fixtures/conformance/cases.json > oracle-results.json
      - run: dotnet run --project tools/DtdlOracle/DtdlOracle.csproj --no-build -- --geospatial > geometry-results.json
      - run: python tools/check_dtdl_oracle.py oracle-results.json geometry-results.json
